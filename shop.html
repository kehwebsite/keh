<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | Kara Embroidery House</title>
<meta name="description" content="Shop bed cover sets, comforter sets and suits from Kara Embroidery House, Faridabad. Order on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --velvet:#0D0A07; --velvet-2:#16110C; --thread:#C8964A; --thread-soft:#E8C98A;
    --cream:#F5EFE2; --muted:rgba(245,239,226,.62); --line:rgba(139,115,85,.28); --wa:#1FA855;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--velvet); color:var(--cream); font-family:Inter,system-ui,sans-serif; }
  a{ color:inherit; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--thread); outline-offset:3px; }
  img{ display:block; max-width:100%; }

  /* header */
  .top{ position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:14px clamp(16px,4vw,48px); background:rgba(13,10,7,.94); border-bottom:1px solid var(--line); }
  .brand{ text-decoration:none; font-family:'Playfair Display',serif; font-size:18px; letter-spacing:.3em; white-space:nowrap; }
  .top-actions{ display:flex; align-items:center; gap:10px; }
  .home-link{ font-size:13px; color:var(--muted); text-decoration:none; padding:8px 4px; }
  .cart-btn{ display:flex; align-items:center; gap:8px; background:none; border:1px solid rgba(245,239,226,.55); padding:9px 14px; font-size:13px; }
  .cart-count{ min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--thread); color:var(--velvet); font-size:12px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }

  /* intro */
  .intro{ padding:clamp(40px,8vw,90px) clamp(16px,4vw,48px) 24px; max-width:1200px; margin:0 auto; }
  .intro h1{ font-family:'Playfair Display',serif; font-weight:400; font-size:clamp(34px,6vw,64px); line-height:1.05; margin:0 0 14px; }
  .intro p{ margin:0; max-width:52ch; color:var(--muted); line-height:1.7; font-weight:300; }

  /* category tabs */
  .tabs{ display:flex; gap:8px; overflow-x:auto; padding:8px clamp(16px,4vw,48px) 4px; max-width:1200px; margin:0 auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; background:none; border:1px solid var(--line); padding:10px 16px; font-size:14px; color:var(--muted); border-radius:999px; }
  .tab[aria-pressed="true"]{ border-color:var(--thread); color:var(--cream); background:rgba(200,150,74,.12); }

  /* grid */
  .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(14px,2.4vw,28px);
         padding:24px clamp(16px,4vw,48px) 80px; max-width:1200px; margin:0 auto; }
  @media (min-width:760px){ .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (min-width:1100px){ .grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .card{ display:flex; flex-direction:column; gap:10px; background:none; border:0; padding:0; text-align:left; }
  .frame{ position:relative; aspect-ratio:4/5; overflow:hidden; background:var(--velvet-2); border:1px solid var(--line); }
  .frame img{ position:relative; z-index:1; width:100%; height:100%; object-fit:cover; object-position:center 25%; }
  .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:14px; text-align:center;
       font-family:'Playfair Display',serif; font-style:italic; color:rgba(200,150,74,.55); font-size:15px;
       background:repeating-linear-gradient(135deg, rgba(200,150,74,.05) 0 2px, transparent 2px 12px); }
  .badge{ position:absolute; z-index:2; top:10px; left:10px; background:var(--cream); color:var(--velvet); font-size:11px; font-weight:600; padding:4px 8px; }
  .name{ font-family:'Playfair Display',serif; font-size:clamp(15px,1.6vw,18px); line-height:1.3; }
  .prices{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; font-size:14px; }
  .now{ color:var(--thread-soft); font-weight:600; font-size:15px; }
  .was{ color:var(--muted); text-decoration:line-through; }
  .off{ color:var(--thread); font-size:12px; font-weight:500; }
  .ship{ font-size:12px; color:var(--muted); }
  .empty{ grid-column:1/-1; color:var(--muted); padding:40px 0; text-align:center; }

  /* overlay panels (product sheet + cart) */
  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s; }
  .scrim.on{ opacity:1; pointer-events:auto; }
  .panel{ position:fixed; z-index:50; background:var(--velvet); border:1px solid var(--line); display:flex; flex-direction:column;
          transition:transform .3s ease; }
  .sheet{ left:0; right:0; bottom:0; max-height:92vh; max-height:92svh; transform:translateY(105%); border-bottom:0; }
  @media (min-width:900px){ .sheet{ left:50%; right:auto; bottom:auto; top:50%; width:min(880px,92vw); transform:translate(-50%,-40%) scale(.98); opacity:0; pointer-events:none; transition:transform .25s ease, opacity .25s ease; } }
  .sheet.on{ transform:translateY(0); }
  @media (min-width:900px){ .sheet.on{ transform:translate(-50%,-50%); opacity:1; pointer-events:auto; } }
  .drawer{ top:0; right:0; bottom:0; width:min(420px,100vw); transform:translateX(105%); border-right:0; }
  .drawer.on{ transform:translateX(0); }
  @media (prefers-reduced-motion:reduce){ .panel,.scrim{ transition:none; } }

  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); }
  .panel-head h2{ margin:0; font-family:'Playfair Display',serif; font-weight:400; font-size:20px; }
  .x{ background:none; border:0; font-size:26px; line-height:1; padding:4px 8px; color:var(--muted); }
  .panel-body{ overflow-y:auto; padding:18px; }

  .detail{ display:grid; gap:18px; }
  @media (min-width:900px){ .detail{ grid-template-columns:1fr 1fr; gap:28px; } }
  .detail .frame{ max-height:56vh; aspect-ratio:auto; }
  @media (min-width:900px){ .detail .frame{ aspect-ratio:4/5; max-height:none; } }
  .detail h3{ font-family:'Playfair Display',serif; font-weight:400; font-size:clamp(24px,3vw,32px); margin:0 0 10px; line-height:1.15; }
  .detail .prices{ font-size:16px; margin-bottom:6px; }
  .detail .now{ font-size:22px; }
  .desc{ color:var(--muted); line-height:1.7; font-weight:300; margin:14px 0 18px; }
  .swatch-label{ font-size:13px; color:var(--muted); margin:16px 0 8px; }
  .swatch-label strong{ color:var(--cream); font-weight:500; }
  .swatches{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatch{ background:none; border:1px solid var(--line); padding:9px 14px; border-radius:999px; font-size:13px; color:var(--muted); }
  .swatch[aria-pressed="true"]{ border-color:var(--thread); color:var(--cream); background:rgba(200,150,74,.12); }
  .desc ul{ margin:10px 0 0; padding-left:18px; }
  .desc li{ margin:4px 0; }
  .stitch{ display:flex; gap:12px; align-items:flex-start; margin-top:18px; padding:12px 14px; border:1px solid var(--line); cursor:pointer; }
  .stitch input{ margin-top:3px; width:18px; height:18px; accent-color:var(--thread); flex:0 0 auto; }
  .stitch strong{ font-weight:500; }
  .stitch small{ display:block; color:var(--muted); font-size:12px; line-height:1.5; margin-top:3px; }
  .qty{ display:inline-flex; align-items:center; border:1px solid var(--line); }
  .qty button{ background:none; border:0; width:40px; height:40px; font-size:18px; }
  .qty span{ min-width:34px; text-align:center; }
  .row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:16px; }
  .primary{ background:var(--thread); color:var(--velvet); border:0; padding:14px 22px; font-weight:600; font-size:14px; flex:1 1 180px; }
  .primary:disabled{ opacity:.45; cursor:not-allowed; }
  .wa{ background:var(--wa); color:#fff; border:0; padding:15px 22px; font-weight:600; font-size:15px; width:100%; display:flex; align-items:center; justify-content:center; gap:10px; }

  .line{ display:grid; grid-template-columns:64px 1fr auto; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center; }
  .line .frame{ aspect-ratio:4/5; }
  .line .ph{ font-size:10px; padding:4px; }
  .line-name{ font-size:14px; line-height:1.35; margin-bottom:6px; }
  .line .qty button{ width:32px; height:32px; font-size:16px; }
  .line-price{ text-align:right; font-size:14px; }
  .remove{ background:none; border:0; color:var(--muted); font-size:12px; text-decoration:underline; padding:6px 0 0; }
  .totals{ padding:16px 18px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:grid; gap:12px; }
  .total-row{ display:flex; justify-content:space-between; font-size:16px; }
  .saved{ font-size:13px; color:var(--thread-soft); }
  .note{ font-size:12px; color:var(--muted); line-height:1.5; margin:0; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--cream); color:var(--velvet); padding:12px 18px; font-size:14px; z-index:60; opacity:0; transition:all .25s; pointer-events:none; }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  .foot{ border-top:1px solid var(--line); padding:32px clamp(16px,4vw,48px); text-align:center; color:var(--muted); font-size:13px; line-height:1.9; }
  .foot em{ font-family:'Playfair Display',serif; color:var(--thread-soft); font-size:15px; }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="index.html">KARA</a>
  <div class="top-actions">
    <a class="home-link" href="index.html">Home</a>
    <button class="cart-btn" id="openCart" aria-label="Open cart">Cart <span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<section class="intro">
  <h1>Shop</h1>
  <p>Ready pieces from our studio in Faridabad.</p>
</section>

<nav class="tabs" id="tabs" aria-label="Categories"></nav>
<main class="grid" id="grid"></main>

<footer class="foot">
  <em>Customise. Don't Compromise.</em><br>
  SCO 230, Omaxe World Street, Sector 79, Faridabad, Haryana 121004<br>
  <a href="https://wa.me/917835979899" target="_blank" rel="noopener">WhatsApp +91 78359 79899</a>
</footer>

<div class="scrim" id="scrim"></div>

<section class="panel sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel-head"><h2 id="sheetTitle">Product</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div class="panel-body" id="sheetBody"></div>
</section>

<aside class="panel drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <div class="panel-head"><h2 id="cartTitle">Your cart</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div class="panel-body" id="cartBody"></div>
  <div class="totals" id="cartTotals"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   EDIT YOUR PRODUCTS HERE
   ---------------------------------------------------------------------
   One block per product. Copy a block to add a new one.
   - id:        short unique code, no spaces (e.g. "suit-07")
   - category:  "bedding" or "suits" (suits are shown as unstitched)
   - name:      what customers see
   - price:     the REAL full price in rupees, numbers only (no commas)
   - image:     photo path, e.g. "assets/shop/suit-07.jpg"
   - details:   one or two lines about the piece (optional)
   - bestseller: true to show a "Bestseller" tag (only when it's true!)
   - colours:   OPTIONAL. For one design in several colours, list each
                colour with its own photo instead of using image:
                colours:[ { name:"Mustard", image:"assets/shop/suit-03.jpg" }, ... ]
   - stitching: OPTIONAL. All suits already offer stitching with the price
                confirmed on WhatsApp. To show a fixed stitching price for
                one design instead, put a number (e.g. stitching:850).
                stitching:false hides the option for that product.
   - stitchingTime: OPTIONAL. e.g. "7–10 days". Leave "" if it varies.
   - details:   can be several lines inside `backticks`. The first line
                shows as an intro, every line after it as a bullet point.
   Any discount is worked out automatically from DISCOUNT below.
   ===================================================================== */
const PRODUCTS = [
  { id:"gajji-print", category:"suits", name:"Gajji silk printed suit", price:2599,
    colours:[
      { name:"Rani pink", image:"assets/shop/suit-01.jpg" },
      { name:"Ivory",     image:"assets/shop/suit-02.jpg" },
      { name:"Mustard",   image:"assets/shop/suit-03.jpg" },
      { name:"Turquoise", image:"assets/shop/suit-04.jpg" },
    ],
    details:`A beautiful blend of vibrant colours and traditional elegance.
Gajji silk position print shirt – 2.5 m
Opara silk bottom – 2.5 m
Chiffon dupatta with lace – 2.5 m
Elegant mirror work and cut dana work
Perfect for festive occasions, parties and weddings`,
    stitching:null, stitchingTime:"",   // null = price confirmed on WhatsApp
    bestseller:false },
  { id:"suit-05", category:"suits", name:"Mustard woven suit with embellished neckline", price:4499, image:"assets/shop/suit-05.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-06", category:"suits", name:"Pink leheriya suit", price:2999, image:"assets/shop/suit-06.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-07", category:"suits", name:"Rust embroidered tissue suit", price:5499, image:"assets/shop/suit-07.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-08", category:"suits", name:"Rani pink embroidered suit with cutwork dupatta", price:5299, image:"assets/shop/suit-08.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-09", category:"suits", name:"Magenta embroidered suit", price:4999, image:"assets/shop/suit-09.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-10", category:"suits", name:"Mustard embroidered suit with cutwork dupatta", price:5299, image:"assets/shop/suit-10.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-11", category:"suits", name:"Lavender embroidered suit", price:5499, image:"assets/shop/suit-11.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-12", category:"suits", name:"Sage green embroidered suit", price:5499, image:"assets/shop/suit-12.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-13", category:"suits", name:"Powder blue embroidered suit", price:5499, image:"assets/shop/suit-13.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-14", category:"suits", name:"Teal floral embroidered suit", price:4799, image:"assets/shop/suit-14.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-15", category:"suits", name:"Dusty rose floral embroidered suit", price:4799, image:"assets/shop/suit-15.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-16", category:"suits", name:"Purple embroidered suit with potli", price:5999, image:"assets/shop/suit-16.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-17", category:"suits", name:"Red embroidered suit with potli", price:5999, image:"assets/shop/suit-17.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-18", category:"suits", name:"Olive gold mirror-work suit", price:5799, image:"assets/shop/suit-18.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-19", category:"suits", name:"Beige mirror-work suit with green dupatta", price:5299, image:"assets/shop/suit-19.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-20", category:"suits", name:"Dusty pink gota suit with mustard dupatta", price:5499, image:"assets/shop/suit-20.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"suit-21", category:"suits", name:"Multicolour patchwork printed suit", price:3499, image:"assets/shop/suit-21.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-01", category:"bedding", name:"Grey quilted bedcover set with charcoal motifs", price:4999, image:"assets/shop/bed-01.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-02", category:"bedding", name:"Sage green floral comforter set", price:5999, image:"assets/shop/bed-02.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-03", category:"bedding", name:"Mauve grey embroidered quilted bedcover set", price:5499, image:"assets/shop/bed-03.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-04", category:"bedding", name:"Maroon floral comforter set", price:5999, image:"assets/shop/bed-04.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-05", category:"bedding", name:"Lavender floral comforter set", price:5999, image:"assets/shop/bed-05.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-06", category:"bedding", name:"Chocolate brown floral comforter set", price:5999, image:"assets/shop/bed-06.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-07", category:"bedding", name:"Ivory and gold embroidered quilted bedcover set", price:5499, image:"assets/shop/bed-07.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-08", category:"bedding", name:"Cream bedcover set with gold motifs", price:4999, image:"assets/shop/bed-08.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-09", category:"bedding", name:"White bedcover set with blush motifs", price:4999, image:"assets/shop/bed-09.jpg", details:"", bestseller:false },  // DUMMY PRICE
  { id:"bed-10", category:"bedding", name:"Ice blue embroidered quilted bedcover set", price:5499, image:"assets/shop/bed-10.jpg", details:"", bestseller:false },  // DUMMY PRICE
];

const CATEGORIES = [
  { key:"all",     label:"All" },
  { key:"bedding", label:"Bed cover & comforter sets" },
  { key:"suits",   label:"Unstitched suits", tag:"Unstitched", stitching:true },  // stitching:true = every suit offers stitching, price confirmed on WhatsApp
];

const DISCOUNT = 0;                  // % off for every product. 0 = no discount shown. Change to 10 or 15 later.
const SHIPS = "Usually ships in 24 hours";
const WHATSAPP = "917835979899";     // country code + number, no + or spaces
/* ===================== nothing below needs editing ===================== */

const $ = (s) => document.querySelector(s);
const inr = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
const salePrice = (p) => Math.round(p.price * (100 - DISCOUNT) / 100);
PRODUCTS.forEach(p => { if (p.colours && p.colours.length && !p.image) p.image = p.colours[0].image; });
const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const splitKey = (k) => { const [id, colour = "", st = ""] = k.split("|"); return [id, colour, st === "s"]; };
const makeKey = (id, colour, st) => st ? `${id}|${colour}|s` : (colour ? `${id}|${colour}` : id);
const stitchMode = (p) => p.stitching ?? (CATEGORIES.find(c => c.key === p.category) || {}).stitching ?? false;
const stitchPrice = (p) => typeof stitchMode(p) === "number" ? stitchMode(p) : 0;
const hasStitching = (p) => stitchMode(p) === true || stitchPrice(p) > 0;
const stitchToConfirm = (p) => hasStitching(p) && !stitchPrice(p);
const unitPrice = (p, st) => salePrice(p) + (st ? stitchPrice(p) : 0);
const colourOf = (p, name) => (p.colours || []).find(c => c.name === name);
const lineImage = (p, colour) => (colourOf(p, colour) || {}).image || p.image;
const tagOf = (p) => (CATEGORIES.find(c => c.key === p.category) || {}).tag || "";
const lineName = (p, colour, st) => `${p.name}${tagOf(p) && !st ? ` (${tagOf(p).toLowerCase()})` : ""}${colour ? ` – ${colour}` : ""}${st ? (stitchToConfirm(p) ? " + stitching (price to confirm)" : " + stitching") : ""}`;
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let cart = {};
try { cart = JSON.parse(localStorage.getItem("kara-cart") || "{}") || {}; } catch (e) { cart = {}; }
Object.keys(cart).forEach(k => {
  const [id, colour, st] = splitKey(k), p = byId[id];
  if (!p || (p.colours ? !colourOf(p, colour) : colour) || (st && !hasStitching(p))) delete cart[k];
});
const saveCart = () => { try { localStorage.setItem("kara-cart", JSON.stringify(cart)); } catch (e) {} };

function frame(p, img = p.image, extra = "") {
  return `<div class="frame">
    <div class="ph">${esc(p.name)}</div>
    <img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy" decoding="async" onerror="this.remove()">
    ${p.bestseller ? '<span class="badge">Bestseller</span>' : ""}${extra}
  </div>`;
}
function priceHTML(p) {
  if (DISCOUNT <= 0) return `<div class="prices"><span class="now">${inr(p.price)}</span></div>`;
  return `<div class="prices"><span class="now">${inr(salePrice(p))}</span><span class="was">${inr(p.price)}</span><span class="off">${DISCOUNT}% off</span></div>`;
}

/* tabs + grid */
let active = "all";
function renderTabs() {
  $("#tabs").innerHTML = CATEGORIES.map(c =>
    `<button class="tab" aria-pressed="${c.key === active}" data-cat="${c.key}">${esc(c.label)}</button>`).join("");
}
function renderGrid() {
  const list = PRODUCTS.filter(p => active === "all" || p.category === active);
  $("#grid").innerHTML = list.length ? list.map(p => `
    <button class="card" data-open="${esc(p.id)}" aria-label="${esc(p.name)}, ${inr(salePrice(p))}">
      ${frame(p)}
      <div class="name">${esc(p.name)}</div>
      ${priceHTML(p)}
      <div class="ship">${[tagOf(p), p.colours ? `${p.colours.length} colours` : "", SHIPS].filter(Boolean).join(" · ")}</div>
    </button>`).join("") : `<p class="empty">New pieces are coming to this section soon.</p>`;
}
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  active = b.dataset.cat; renderTabs(); renderGrid();
});

/* panels */
let lastFocus = null;
function openPanel(el) {
  lastFocus = document.activeElement;
  $("#scrim").classList.add("on"); el.classList.add("on");
  document.body.style.overflow = "hidden";
  setTimeout(() => el.querySelector("[data-close]").focus(), 60);
}
function closePanels() {
  $("#scrim").classList.remove("on");
  document.querySelectorAll(".panel.on").forEach(p => p.classList.remove("on"));
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
$("#scrim").addEventListener("click", closePanels);
document.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closePanels(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanels(); });

function detailsHTML(t) {
  const lines = String(t || "").split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) return "";
  const rest = lines.slice(1);
  return `<div class="desc"><div>${esc(lines[0])}</div>${rest.length ? `<ul>${rest.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}</div>`;
}

/* product sheet */
let sheetQty = 1, sheetId = null, sheetColour = "", sheetStitch = false;
const shipText = (p, st) => st
  ? ["Stitched to your measurements", p.stitchingTime ? `Ready in ${p.stitchingTime}` : (stitchToConfirm(p) ? "Price and time confirmed on WhatsApp" : "Time confirmed on WhatsApp")].join(" · ")
  : [tagOf(p), SHIPS].filter(Boolean).join(" · ");
function openProduct(id) {
  const p = byId[id]; if (!p) return;
  sheetId = id; sheetQty = 1; sheetStitch = false; sheetColour = p.colours ? p.colours[0].name : "";
  $("#sheetTitle").textContent = CATEGORIES.find(c => c.key === p.category)?.label || "Product";
  $("#sheetBody").innerHTML = `
    <div class="detail">
      <div id="sheetFrame">${frame(p, lineImage(p, sheetColour))}</div>
      <div>
        <h3>${esc(p.name)}</h3>
        ${priceHTML(p)}
        <div class="ship" id="shipLine">${shipText(p, false)}</div>
        ${p.colours ? `<div class="swatch-label">Colour: <strong id="colourName">${esc(sheetColour)}</strong></div>
        <div class="swatches" role="group" aria-label="Colour">${p.colours.map(c =>
          `<button class="swatch" data-colour="${esc(c.name)}" aria-pressed="${c.name === sheetColour}">${esc(c.name)}</button>`).join("")}</div>` : ""}
        ${hasStitching(p) ? `<label class="stitch"><input type="checkbox" id="stitchBox">
          <span><strong>Add stitching${stitchPrice(p) ? ` (+${inr(stitchPrice(p))})` : ""}</strong>
          <small>${stitchPrice(p)
            ? `Made to your measurements, which we'll take on WhatsApp after you order.${p.stitchingTime ? ` Ready in ${esc(p.stitchingTime)}.` : " Stitching time depends on the design."}`
            : "Stitching price and time depend on the design. We'll confirm both and take your measurements on WhatsApp."}</small></span></label>` : ""}
        ${detailsHTML(p.details)}
        <div class="row">
          <div class="qty" aria-label="Quantity">
            <button data-sq="-1" aria-label="Less">−</button><span id="sq">1</span><button data-sq="1" aria-label="More">+</button>
          </div>
          <button class="primary" id="addBtn">Add to cart</button>
        </div>
      </div>
    </div>`;
  openPanel($("#sheet"));
}
$("#grid").addEventListener("click", (e) => { const c = e.target.closest("[data-open]"); if (c) openProduct(c.dataset.open); });
$("#sheetBody").addEventListener("change", (e) => {
  if (e.target.id !== "stitchBox") return;
  sheetStitch = e.target.checked;
  $("#shipLine").textContent = shipText(byId[sheetId], sheetStitch);
});
$("#sheetBody").addEventListener("click", (e) => {
  const sw = e.target.closest("[data-colour]");
  if (sw) {
    const p = byId[sheetId]; sheetColour = sw.dataset.colour;
    document.querySelectorAll("#sheetBody .swatch").forEach(b => b.setAttribute("aria-pressed", String(b === sw)));
    $("#colourName").textContent = sheetColour;
    $("#sheetFrame").innerHTML = frame(p, lineImage(p, sheetColour));
    return;
  }
  const q = e.target.closest("[data-sq]");
  if (q) { sheetQty = Math.max(1, Math.min(20, sheetQty + Number(q.dataset.sq))); $("#sq").textContent = sheetQty; return; }
  if (e.target.id === "addBtn") {
    const key = makeKey(sheetId, sheetColour, sheetStitch);
    cart[key] = Math.min(20, (cart[key] || 0) + sheetQty);
    saveCart(); renderCart(); closePanels();
    toast("Added to cart");
  }
});

/* cart */
function renderCart() {
  const ids = Object.keys(cart);
  const count = ids.reduce((s, id) => s + cart[id], 0);
  $("#cartCount").textContent = count;
  if (!ids.length) {
    $("#cartBody").innerHTML = `<p class="note" style="font-size:14px">Your cart is empty. Tap any product to add it here.</p>`;
    $("#cartTotals").innerHTML = "";
    return;
  }
  let total = 0, full = 0, pending = false;
  $("#cartBody").innerHTML = ids.map(id => {
    const [pid, colour, st] = splitKey(id), p = byId[pid], q = cart[id];
    total += unitPrice(p, st) * q; full += (p.price + (st ? stitchPrice(p) : 0)) * q;
    if (st && stitchToConfirm(p)) pending = true;
    return `<div class="line">
      ${frame(p, lineImage(p, colour))}
      <div>
        <div class="line-name">${esc(lineName(p, colour, st))}</div>
        <div class="qty"><button data-cq="-1" data-id="${esc(id)}" aria-label="Less">−</button><span>${q}</span><button data-cq="1" data-id="${esc(id)}" aria-label="More">+</button></div>
        <div><button class="remove" data-rm="${esc(id)}">Remove</button></div>
      </div>
      <div class="line-price"><div class="now">${inr(unitPrice(p, st) * q)}</div>${DISCOUNT > 0 ? `<div class="was">${inr((p.price + (st ? stitchPrice(p) : 0)) * q)}</div>` : ""}</div>
    </div>`;
  }).join("");
  $("#cartTotals").innerHTML = `
    <div class="total-row"><span>Total</span><strong>${inr(total)}${pending ? " + stitching" : ""}</strong></div>
    ${pending ? `<p class="note">Stitching charges depend on the design. We'll confirm them on WhatsApp.</p>` : ""}
    ${DISCOUNT > 0 ? `<div class="saved">You save ${inr(full - total)} (${DISCOUNT}% off)</div>` : ""}
    <button class="wa" id="orderWa">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
      Order on WhatsApp
    </button>
    <p class="note">This opens WhatsApp with your order filled in. Just press send. We'll confirm availability, delivery and payment with you there.</p>`;
}
$("#cartBody").addEventListener("click", (e) => {
  const q = e.target.closest("[data-cq]"), r = e.target.closest("[data-rm]");
  if (q) { const id = q.dataset.id; cart[id] = (cart[id] || 0) + Number(q.dataset.cq); if (cart[id] <= 0) delete cart[id]; else cart[id] = Math.min(20, cart[id]); }
  else if (r) { delete cart[r.dataset.rm]; }
  else return;
  saveCart(); renderCart();
});
$("#cartTotals").addEventListener("click", (e) => {
  if (!e.target.closest("#orderWa")) return;
  let total = 0, anyStitch = false, pending = false;
  const lines = Object.keys(cart).map((id, i) => {
    const [pid, colour, st] = splitKey(id), p = byId[pid], q = cart[id], t = unitPrice(p, st) * q; total += t;
    if (st) { anyStitch = true; if (stitchToConfirm(p)) pending = true; }
    return `${i + 1}. ${lineName(p, colour, st)} (${p.id}) x ${q} = ${inr(t)}`;
  });
  const msg = `Hello Kara Embroidery House, I'd like to order:\n\n${lines.join("\n")}\n\nTotal: ${inr(total)}${DISCOUNT > 0 ? ` (after ${DISCOUNT}% off)` : ""}${pending ? " + stitching charges" : ""}${anyStitch ? (pending ? "\n\nStitching: please confirm the stitching price and time, and guide me on the measurements you need." : "\n\nStitching: please guide me on the measurements you need.") : ""}\n\nName:\nDelivery address:\nPin code:`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
});
$("#openCart").addEventListener("click", () => { renderCart(); openPanel($("#drawer")); });

let tt;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1800); }

renderTabs(); renderGrid(); renderCart();
</script>
</body>
</html>
